services: 
  db: 
    healthcheck: 
      # isready ships with pg
      # CMD-SHELL runs the next string through a shell
      # $$ is for when our config needs a literal dollar sign
      # Our environment will have its own pg_user/db, so we want it
      #  to refer to ${blah}
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    image: postgres:16 # 16 is a stable version
    # auto restarts if it crashes or if the daemon restarts (e.g. machine reboot)
    # stops when running `docker compose stop`
    restart: unless-stopped
    environment:
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products # todo bonus: encrypt
      POSTGRES_DB: products
    ports:
      - "5432:5432"
    volumes:
      # citation: https://hub.docker.com/_/postgres
      # /var/lib/postgresql/data maps to Postgres's data directory in the container
      - pgdata:/var/lib/postgresql/data
      # bind mount. maps the init into the container. 
      # postgres images auto run any sh file under /docker-entrypoint-initdb.d/ 
      # only runs on the first init of a data directory
      # :z relates to SELinux
      # it sets the tags on the file such that it can be read in the container if SELinux is 
      # blocking it
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:z
  backend:
    build:
      # this tells compose to grab the backend docker file and build from there
      ./backend
    ports:
      - "8080:8080"
    environment:
      # This environment variable overrides spring.datasource.url:
      #   - naming rule: replace dots with underscores, remove dashes, uppercase
      #     (spring.datasource.url -> SPRING_DATASOURCE_URL)
      #   - environment variables come after application.properties in Spring's
      #     property source order, so they win
      #   - service-to-service traffic uses the container port (5432), not the host port
      # citation: https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.datasource.configuration
      # citation: https://docs.spring.io/spring-boot/reference/features/external-config.html#features.external-config.typesafe-configuration-properties.relaxed-binding.environment-variables
      # citation: https://docs.spring.io/spring-boot/reference/features/external-config.html
      # citation: https://docs.docker.com/compose/how-tos/networking/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/products
    depends_on:
      db:
        # waits for db's healthcheck to verify first, then starts
        condition: service_healthy
  frontend:
    build:
      ./frontend
    ports:
      - "3000:80"
    


# citation: https://docs.docker.com/engine/storage/volumes/
# Without volumes, Postgres writes its data files inside the container's own larger filesystem layer. 
# Without it, we lose the db when we bring down the container. 
# With this, it keeps the db between sessions. 
# If we want to remove the volume, we can do `docker compose down -v`
volumes:
  pgdata:
